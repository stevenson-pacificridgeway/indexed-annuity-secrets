<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Gregory Stevenson Financial Services monogram">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#16315c"/>
      <stop offset="60%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#08172e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6d3a0"/>
      <stop offset="48%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#a9842f"/>
    </linearGradient>
    <path id="topArc" d="M 38 100 A 62 62 0 0 1 162 100" fill="none"/>
    <path id="botArc" d="M 44 100 A 56 56 0 0 0 156 100" fill="none"/>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.55"/>

  <!-- arched text -->
  <text fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" letter-spacing="3.2" font-weight="600">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">GREGORY STEVENSON</textPath>
  </text>
  <text fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="9.5" letter-spacing="3.6">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">FINANCIAL  SERVICES</textPath>
  </text>

  <!-- side stars -->
  <g fill="url(#gold)">
    <path d="M30 100 l2.4 -2.4 l2.4 2.4 l-2.4 2.4 z"/>
    <path d="M170 100 l-2.4 -2.4 l-2.4 2.4 l2.4 2.4 z"/>
  </g>

  <!-- GS monogram -->
  <text x="100" y="120" text-anchor="middle" fill="url(#gold)"
        font-family="'Didot','Bodoni MT',Georgia,serif" font-size="62" font-style="italic" font-weight="600">GS</text>
</svg>
